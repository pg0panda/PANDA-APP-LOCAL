<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>كود 3 شهور</title>
  <style>body{font-family:sans-serif;padding:24px;background:#07111a;color:#fff}</style>
</head>
<body>
  <div style="max-width:520px;margin:32px auto;padding:28px;background:#081522;border-radius:8px;text-align:center;">
    <h2 style="margin-top:0;color:#fff">كود 3 شهور</h2>
    <div id="code-value" data-code="PUT-YOUR-CODE-HERE" style="display:none"></div>
    <div id="code" style="font-family:monospace;background:#051221;color:#dceff9;padding:14px;border-radius:6px;font-size:20px;word-break:break-all">-- لا يوجد كود --</div>
    <div style="margin-top:16px">
      <button id="copyBtn" style="padding:8px 12px;margin-right:8px">نسخ</button>
      <button id="closeBtn" style="padding:8px 12px">اغلاق</button>
    </div>
    <div id="note" style="margin-top:12px;color:#9fb0bf"></div>
  </div>
  <script>
    const codeElem = document.getElementById('code');
    const copyBtn = document.getElementById('copyBtn');
    const closeBtn = document.getElementById('closeBtn');
    const note = document.getElementById('note');
    let code = '';
    async function loadCode(){
      try{
        const res = await fetch('/src/data/available_codes.json');
        const json = await res.json();
        code = (new URL(location)).searchParams.get('code') || (json['3months'] && json['3months'].length ? json['3months'][0] : '');
        if(!code){ codeElem.textContent = '-- لا يوجد كود --'; copyBtn.disabled = true; }
        else { codeElem.textContent = code; }
      }catch(e){ codeElem.textContent = '-- لا يمكن تحميل الأكواد --'; copyBtn.disabled = true }
    }
    loadCode();
    copyBtn.addEventListener('click', async ()=>{ try{ await navigator.clipboard.writeText(code); note.textContent = 'تم نسخ الكود إلى الحافظة'; const owner='mohamednasr9040@gmail.com'; const subject=encodeURIComponent('Claimed code: '+code); const body=encodeURIComponent('تم أخذ الكود: '+code+'\nالصفحة: 3months\nالوقت: '+new Date().toISOString()); window.location.href=`mailto:${owner}?subject=${subject}&body=${body}`; }catch(e){ note.textContent = 'تعذر النسخ. انسخ يدويًا.' } });
    closeBtn.addEventListener('click', ()=>{ window.close(); note.textContent = 'أغلق النافذة يدويًا إن لم تُغلق تلقائيًا.'; });
  </script>
</body>
</html>
