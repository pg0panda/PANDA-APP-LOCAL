<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>الأكواد المأخوذة</title>
  <style>body{font-family:sans-serif;padding:24px;background:#071023;color:#fff}ul{max-width:720px;margin:24px auto;padding:16px;background:#081426;border-radius:8px}</style>
</head>
<body>
  <h2 style="text-align:center;color:#fff">الأكواد المأخوذة</h2>
  <div id="list"></div>
  <script>
    async function load(){
      try{
        const res = await fetch('/src/data/claimed_codes.json');
        const j = await res.json();
        const list = j.claimed || [];
        const container = document.getElementById('list');
        if(!list.length) return container.innerHTML = '<p style="text-align:center;color:#9fb0bf">لا توجد أكواد مَأخوذة بعد.</p>';
        const ul = document.createElement('ul');
        list.forEach(i=>{ const li=document.createElement('li'); li.textContent = i; ul.appendChild(li); });
        container.appendChild(ul);
      }catch(e){ document.getElementById('list').innerText = 'تعذر تحميل القائمة'; }
    }
    load();
  </script>
</body>
</html>
