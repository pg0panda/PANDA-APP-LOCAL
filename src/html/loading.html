<!-- =================================================== -->
<!--          محتويات ملف loading.html بالكامل          -->
<!-- =================================================== -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --loading-duration: 8s; /* مدة التحميل يمكن التحكم بها من هنا */
        }
        * { box-sizing: border-box; }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 50%, #0f0f0f 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            animation: fadeIn 1s ease-out forwards;
            opacity: 0;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 80%, rgba(79, 172, 254, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(67, 233, 123, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 40% 40%, rgba(0, 242, 254, 0.05) 0%, transparent 50%);
            animation: float 20s ease-in-out infinite;
            z-index: -1;
        }
        @keyframes float {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(180deg); }
        }
        .container {
            text-align: center;
            z-index: 10;
            animation: slideUp 1.2s ease-out 0.5s both;
        }
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .logo-container {
            position: relative;
            display: inline-block;
            margin-bottom: 30px;
        }
        img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(79, 172, 254, 0.4), 0 0 60px rgba(0, 242, 254, 0.2), 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: pulse 2s ease-in-out infinite;
            border: 3px solid rgba(255, 255, 255, 0.1);
        }
        .logo-container::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top: 2px solid #4facfe;
            border-right: 2px solid #00f2fe;
            animation: spin 3s linear infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            font-weight: 300;
            letter-spacing: 4px;
            font-size: 1.8em;
            margin: 0 0 30px 0;
            background: linear-gradient(45deg, #4facfe, #00f2fe, #43e97b, #38f9d7);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textGlow 3s ease-in-out infinite;
        }
        @keyframes textGlow {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .progress-container {
            width: 300px;
            margin: 0 auto;
            position: relative;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }
        .progress-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .progress-bar-inner {
            height: 100%;
            width: 0;
            border-radius: 10px;
            background: linear-gradient(90deg, #4facfe, #00f2fe, #43e97b, #38f9d7, #4facfe);
            background-size: 200% 100%;
            animation:
                load var(--loading-duration) cubic-bezier(0.4, 0, 0.2, 1) forwards,
                gradient-flow 2s linear infinite;
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.5), 0 2px 10px rgba(0, 242, 254, 0.3);
            position: relative;
        }
        .progress-bar-inner::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 20px;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6));
            border-radius: 0 10px 10px 0;
            opacity: 0.8;
        }
        @keyframes gradient-flow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        @keyframes load {
            from { width: 0%; }
            to { width: 100%; }
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        .loading-text {
            margin-top: 20px;
            font-size: 0.95em;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 2px;
            min-height: 1.4em;
        }
        .loading-detail {
            margin-top: 8px;
            font-size: 0.8em;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
            min-height: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <!-- سيتم استبدال هذا المسار ديناميكيًا -->
            <img src="" id="logo-image" alt="Logo">
        </div>
        <h2>LOADING...</h2>
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-bar-inner"></div>
            </div>
        </div>
        <div class="loading-text" id="loading-text">Please wait!</div>
        <div class="loading-detail" id="loading-detail"></div>
    </div>
    <script>
        const { ipcRenderer } = require('electron');

        const logo = document.getElementById('logo-image');
        const loadingText = document.getElementById('loading-text');
        const loadingDetail = document.getElementById('loading-detail');
        const progressBar = document.querySelector('.progress-bar-inner');

        ipcRenderer.on('set-logo', (event, imageSrc) => {
            if (logo) {
                logo.src = imageSrc;
            }
        });

        ipcRenderer.on('loading-status', (event, data) => {
            if (loadingText) {
                loadingText.textContent = data.message || 'Preparing...';
            }
            if (loadingDetail) {
                loadingDetail.textContent = data.detail || '';
            }
            if (progressBar && typeof data.progress === 'number') {
                progressBar.style.animation = 'none';
                progressBar.style.transition = 'width 0.3s ease';
                progressBar.style.width = `${Math.max(0, Math.min(100, data.progress))}%`;
            }
        });
    </script>
    
</body>
</html>
