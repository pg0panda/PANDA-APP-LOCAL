<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<title>Banned</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Tajawal', sans-serif;
    background: transparent;
    color: #fff;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    /* تم تعديل السطر بالأسفل للسماح بالتحديد */
    user-select: text; 
    -webkit-user-select: text; /* لدعم متصفحات الكروميوم وإلكترون بشكل كامل */
    -webkit-app-region: drag;
  }

  .card {
    width: 400px;
    background: #0f0f14;
    border: 1.5px solid rgba(200,35,35,0.55);
    border-radius: 16px;
    padding: 34px 28px 26px;
    box-shadow: 0 0 30px rgba(180,20,20,0.12);
    animation: fadeUp 0.4s cubic-bezier(.22,.68,0,1.2) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px) scale(0.97); }
    to   { opacity: 1; transform: none; }
  }

  /* أيقونة القفل */
  .lock-wrap {
    width: 62px;
    height: 62px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: rgba(185,18,18,0.14);
    border: 1.5px solid rgba(185,18,18,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: pulse 2.6s ease-in-out infinite;
    user-select: none; /* منع تحديد الأيقونة */
  }

  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(185,18,18,0.3); }
    50%      { box-shadow: 0 0 0 11px rgba(185,18,18,0); }
  }

  .lock-wrap svg {
    width: 28px;
    height: 28px;
    fill: #cc2a2a;
    filter: drop-shadow(0 0 7px rgba(200,30,30,0.5));
  }

  .title {
    text-align: center;
    font-size: 25px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 0.3px;
    margin-bottom: 4px;
  }

  .subtitle {
    text-align: center;
    font-size: 12px;
    color: rgba(255,255,255,0.22);
    letter-spacing: 3px;
    margin-bottom: 22px;
  }

  .info-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 9px;
    padding: 11px 13px;
    margin-bottom: 8px;
    -webkit-app-region: no-drag; /* يسمح بالتحديد والنسخ داخل الـ Electron دون سحب النافذة بالخطأ */
  }

  .info-row .label {
    font-size: 15px;
    color: rgba(255,255,255,0.28);
    min-width: 44px;
    padding-top: 3px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    flex-shrink: 0;
    user-select: none; /* منع تحديد العناوين الجانبية مثل HWID والسبب */
  }

  .info-row .value {
    font-size: 15px;
    color: rgba(255,255,255,0.8);
    font-weight: 600;
    word-break: break-all;
    line-height: 1.5;
  }

  .info-row .value.red { color: #cc3a3a; }

  .divider {
    height: 1px;
    background: rgba(255,255,255,0.06);
    margin: 16px 0;
  }

  .btn-close {
    -webkit-app-region: no-drag;
    width: 100%;
    padding: 12px;
    background: rgba(170,18,18,0.18);
    border: 1.5px solid rgba(170,18,18,0.45);
    border-radius: 9px;
    color: #cc3535;
    font-family: 'Tajawal', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: background 0.18s, border-color 0.18s, transform 0.1s;
    user-select: none; /* منع تحديد نص زر الإغلاق */
  }

  .btn-close:hover  { background: rgba(170,18,18,0.3); border-color: rgba(170,18,18,0.65); }
  .btn-close:active { transform: scale(0.98); }

  .countdown {
    text-align: center;
    font-size: 12px;
    color: rgba(255,255,255,0.16);
    margin-top: 11px;
    user-select: none; /* منع تحديد العداد */
  }

  .countdown span { color: rgba(255,255,255,0.36); font-weight: 700; }
</style>
</head>
<body>

<div class="card">

  <div class="lock-wrap">
    <svg viewBox="0 0 24 24"><path d="M18 8h-1V6A5 5 0 0 0 7 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zm-6 9a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm3.1-9H8.9V6a3.1 3.1 0 0 1 6.2 0v2z"/></svg>
  </div>

  <div class="title">تم حظر هذا الجهاز</div>
  <div class="subtitle">DEVICE BANNED</div>

  <div class="info-row">
    <div class="label">السبب</div>
    <div class="value red" id="reason">—</div>
  </div>

  <div class="info-row">
    <div class="label">تاريخ الحظر</div>
    <div class="value" id="banned-at">—</div>
  </div>

  <div class="info-row">
    <div class="label">تاريخ الانتهاء</div>
    <div class="value" id="ban-expiry">—</div>
  </div>

  <div class="info-row">
    <div class="label">HWID</div>
    <div class="value" id="hwid">—</div>
  </div>

  <div class="info-row">
    <div class="label">MAC</div>
    <div class="value" id="mac">—</div>
  </div>

  <div class="divider"></div>

  <button class="btn-close" id="closeBtn">إغلاق البرنامج</button>
  <div class="countdown">سيتم الإغلاق تلقائياً خلال <span id="timer">10</span> ثواني</div>

</div>

<script>
const { ipcRenderer } = require('electron');

ipcRenderer.on('ban-data', (event, data) => {
  if (data.reason)    document.getElementById('reason').textContent    = data.reason;
  if (data.bannedAt)  document.getElementById('banned-at').textContent = data.bannedAt;
  if (data.banExpiry) document.getElementById('ban-expiry').textContent = data.banExpiry;
  if (data.hwid)      document.getElementById('hwid').textContent      = data.hwid;
  document.getElementById('mac').textContent = data.macAddress || '—';
});

let secs = 10;
const timerEl = document.getElementById('timer');
const countdown = setInterval(() => {
  secs--;
  timerEl.textContent = secs;
  if (secs <= 0) { clearInterval(countdown); ipcRenderer.send('ban-close'); }
}, 1000);

document.getElementById('closeBtn').addEventListener('click', () => {
  clearInterval(countdown);
  ipcRenderer.send('ban-close');
});
</script>
</body>
</html>
