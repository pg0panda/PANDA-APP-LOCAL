<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تأكيد الدفع - كود اليوم</title>
  <style>body{font-family:sans-serif;padding:24px;background:#082032;color:#fff}label,input{display:block;margin:8px 0}input{padding:8px;width:100%;max-width:420px}</style>
</head>
<body>
  <h2>صفحة تسجيل لكود اليوم</h2>
  <form id="form">
    <label>الاسم<input name="name" required /></label>
    <label>البريد الإلكتروني<input name="email" type="email" required /></label>
    <input type="hidden" name="page" value="day" />
    <button type="submit">إرسال</button>
  </form>
  <div id="msg"></div>
  <script>
    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    const endpoint = new URL(location.search.replace('?','') || '', location).searchParams.get('webhook') || 'http://localhost:3000/submit';
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const data = { name: form.name.value.trim(), email: form.email.value.trim(), page: 'day' };
      try{
        const res = await fetch(endpoint, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)});
        const j = await res.json();
        if(res.ok) msg.textContent = 'تم استلام بياناتك، سيصلك الكود عبر البريد.';
        else msg.textContent = 'حصل خطأ: '+ (j.error||res.status);
      }catch(err){msg.textContent = 'فشل الإرسال: '+err.message}
    })
  </script>
</body>
</html>
