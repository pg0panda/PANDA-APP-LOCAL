<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تأكيد الدفع - أدخل بياناتك</title>
  <style>body{font-family:sans-serif;padding:24px;background:#0f1724;color:#fff}label,input{display:block;margin:8px 0}input{padding:8px;width:100%;max-width:420px}</style>
</head>
<body>
  <div style="max-width:520px;margin:32px auto;padding:28px;background:#0b1220;border-radius:8px;text-align:center;">
    <h2 style="margin-top:0;color:#fff">كودك</h2>
    <div id="code" style="font-family:monospace;background:#071021;color:#cbd5e1;padding:14px;border-radius:6px;font-size:20px;word-break:break-all">جارٍ التحميل...</div>
    <div style="margin-top:16px">
      <button id="copyBtn" style="padding:8px 12px;margin-right:8px">نسخ</button>
      <button id="closeBtn" style="padding:8px 12px">اغلاق</button>
    </div>
    <div id="note" style="margin-top:12px;color:#94a3b8"></div>
  </div>
  <script>
    const codeElem = document.getElementById('code');
    const copyBtn = document.getElementById('copyBtn');
    const closeBtn = document.getElementById('closeBtn');
    const note = document.getElementById('note');
    let code = '';

    async function loadCode(){
      try{
        const res = await fetch('/src/data/available_codes.json');
        const json = await res.json();
        code = (new URL(location)).searchParams.get('code') || (json.generic && json.generic.length ? json.generic[0] : '');
        if(!code){ codeElem.textContent = '-- لا يوجد كود --'; copyBtn.disabled = true; }
        else { codeElem.textContent = code; }
      }catch(e){ codeElem.textContent = '-- لا يمكن تحميل الأكواد --'; copyBtn.disabled = true }
    }
    loadCode();

    copyBtn.addEventListener('click', async ()=>{
      try{
        await navigator.clipboard.writeText(code);
        note.textContent = 'تم نسخ الكود إلى الحافظة';
        // افتح رسالة بريد لإعلام المالك أن الكود مأخوذ
        const owner = 'REPLACE_WITH_YOUR_EMAIL';
        const subject = encodeURIComponent('Claimed code: ' + code);
        const body = encodeURIComponent('تم أخذ الكود: ' + code + '\nالصفحة: generic\nالوقت: ' + new Date().toISOString());
        window.location.href = `mailto:${owner}?subject=${subject}&body=${body}`;
      }catch(e){ note.textContent = 'تعذر النسخ. انسخ يدويًا.' }
    });

    closeBtn.addEventListener('click', ()=>{
      window.close();
      note.textContent = 'أغلق النافذة يدويًا إن لم تُغلق تلقائيًا.';
    });
  </script>
</body>
</html>
