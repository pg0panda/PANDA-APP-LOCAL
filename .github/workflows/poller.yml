name: Poll Submissions and Send Codes

on:
  schedule:
    # every 5 minutes (GitHub cron minimum is 5 minutes)
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  poll-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install production dependencies only
        run: npm ci --omit=dev

      - name: Run poller
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          WEBHOOK_ENDPOINT: ${{ secrets.WEBHOOK_ENDPOINT }}
        run: |
          node server/poller.js
